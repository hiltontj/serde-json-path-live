[package]
name = "serde-json-live"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde_json_path = "0.7"
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
